# Mirrors the workflow xbmc's own binary add-ons use (compare
# xbmc/imagedecoder.heif), so a failure here means the same thing it would
# mean there. The add-on is not built standalone: Kodi's cmake/addons drives
# it, which is also what resolves and statically links lunasvg from this
# repo's depends/common/lunasvg/.
name: Build
on: [push, pull_request]
env:
  app_id: imagedecoder.svg

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC build"
            CC: gcc
            CXX: g++
          - name: "Clang build"
            CC: clang
            CXX: clang++
    name: ${{ matrix.name }}
    steps:
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: master
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}
    # cmake/addons normally reads the add-on definition from
    # xbmc/repo-binary-addons. Until this add-on is listed there, point it at
    # the checkout instead - "<id> <source dir>" is the whole format.
    - name: Prepare
      run: |
        mkdir -p ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}
        echo ${app_id} ${{ github.workspace }}/${app_id} > ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
        # Mirrors what the definition in repo-binary-addons will carry. Not
        # required for this build - verified that it builds without it - but
        # keeping it means CI and the real definition agree.
        echo all > ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}/platforms.txt
    - name: Configure
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        cmake \
          -B ${app_id}/build \
          -DADDONS_TO_BUILD=${app_id} \
          -DADDON_SRC_PREFIX=${{ github.workspace }} \
          -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/xbmc/addons \
          -DPACKAGE_ZIP=1 \
          ${{ github.workspace }}/xbmc/cmake/addons
    - name: Build
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)
    # Cheap assertion that a library actually came out. This is not guarding a
    # known silent-skip: the failure modes tried here - no platforms.txt, wrong
    # add-on id - all fail loudly. But the artifact is the thing CI is for, and
    # a restricted platforms.txt later could make "green" stop meaning "built".
    - name: Verify the add-on was actually built
      run: |
        found=$(find ${{ github.workspace }}/xbmc/addons -name "${app_id}.so*" -print -quit)
        if [ -z "$found" ]; then
          echo "::error::no ${app_id}.so produced - the add-on was skipped, not built"
          find ${{ github.workspace }}/xbmc/addons -maxdepth 2 || true
          exit 1
        fi
        echo "built: $found"

  lunasvg-crash:
    # The renderer runs in Kodi's process, so a crash on a hostile SVG is a
    # crash of Kodi. Guards live in depends/common/lunasvg/; this proves they
    # work and that they do not change valid output. See tests/lunasvg-crash.
    name: "lunasvg crash regression"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout add-on repo
      uses: actions/checkout@v5
    - name: Run the regression test
      run: tests/lunasvg-crash/run.sh

  lunasvg-resources:
    # An SVG must not be able to make the decoder open local files: that would
    # bypass Kodi's VFS from inside an add-on handed a memory buffer. See
    # tests/lunasvg-resources.
    name: "external resource access"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout add-on repo
      uses: actions/checkout@v5
    - name: Run the regression test
      run: tests/lunasvg-resources/run.sh
