<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140">
  <defs>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="420" height="140" fill="#1c1f24"/>

  <!-- 1. supported: transform ATTRIBUTE -->
  <g transform="translate(20,40)">
    <rect width="80" height="60" rx="8" fill="#39d353"/>
    <text x="40" y="80" fill="#8b949e" font-family="sans-serif" font-size="11"
          text-anchor="middle">attribute</text>
  </g>

  <!-- 2. filter: unsupported, renders hard-edged -->
  <g transform="translate(160,40)">
    <rect width="80" height="60" rx="8" fill="#58a6ff" filter="url(#soft)"/>
    <text x="40" y="80" fill="#8b949e" font-family="sans-serif" font-size="11"
          text-anchor="middle">filter</text>
  </g>

  <!-- 3. CSS transform in style=: ignored, collapses to 0,0 -->
  <g style="transform:translate(300px,40px)">
    <rect width="80" height="60" rx="8" fill="#ff7b72"/>
    <text x="40" y="80" fill="#8b949e" font-family="sans-serif" font-size="11"
          text-anchor="middle">css transform</text>
  </g>

  <!-- 4. animation: ignored, stays at its start value -->
  <circle cx="30" cy="20" r="8" fill="#d2a8ff">
    <animate attributeName="cx" from="30" to="390" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
